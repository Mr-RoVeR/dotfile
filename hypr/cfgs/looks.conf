general {
    gaps_in = 3
    gaps_out = 8

    border_size = 2
        col.active_border = rgba(5FFBF1ee) rgba(86A8E7ee) rgba(E53F87ee) 45deg
        col.inactive_border = rgba(595959aa)
        resize_on_border = false
        allow_tearing = false
        layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 3

#opacity
    active_opacity = 1.0
    inactive_opacity = 0.85
#shadow
    shadow {
        enabled = true
        range = 20
        offset = 2 2
        ignore_window =  true
        render_power = 3
        color = rgba(00000088)
    }
#blur
    blur {
        enabled = true
        size = 4
        passes = 2
        ignore_opacity = false
        new_optimizations = true
        vibrancy = 0.1696
    }
}
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = slave
}

