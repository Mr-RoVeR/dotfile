#A bit snappy
animations {
    enabled = yes

    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,        1, 2, default
    animation = border,        1, 5, easeOutQuint

    animation = windows,       1, 4, easeOutQuint
    animation = windowsIn,     1, 4, easeOutQuint, popin 87%
    animation = windowsOut,    1, 2, easeInOutCubic, popin 87%

    animation = fadeIn,        1, 1, almostLinear
    animation = fadeOut,       1, 1, almostLinear
    animation = fade,          1, 2, quick

    animation = layers,        1, 3, easeOutQuint
    animation = layersIn,      1, 4, easeOutQuint, fade
    animation = layersOut,     1, 2, easeInOutCubic, fade

    animation = fadeLayersIn,  1, 1, almostLinear
    animation = fadeLayersOut, 1, 1, almostLinear

    animation = workspaces,    1, 3, easeInOutCubic, slide
    animation = workspacesIn,  1, 2, easeInOutCubic, slide
    animation = workspacesOut, 1, 2, easeInOutCubic, slide

    animation = zoomFactor,    1, 5, quick
}

